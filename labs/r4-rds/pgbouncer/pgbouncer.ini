[databases]
appdb = host=postgres port=5432 dbname=appdb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; Deliberately low for R4-03 (connection-pool exhaustion). Real PgBouncer
; enforcement, not a simulated limit.
max_client_conn = 5
default_pool_size = 5
admin_users = appuser
logfile = /tmp/pgbouncer.log
