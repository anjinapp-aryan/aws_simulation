# The actual zero-trust proof: explicit least-privilege allow rules.
# frontend -> backend allowed. backend -> database allowed.
# frontend -> database is deliberately NOT allowed anywhere.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-backend
spec:
  podSelector:
    matchLabels: { tier: backend }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { tier: frontend } }
      ports: [{ protocol: TCP, port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-egress-to-backend
spec:
  podSelector:
    matchLabels: { tier: frontend }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { tier: backend } }
      ports: [{ protocol: TCP, port: 8000 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-to-database
spec:
  podSelector:
    matchLabels: { tier: database }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { tier: backend } }
      ports: [{ protocol: TCP, port: 5432 }]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-backend-egress-to-database
spec:
  podSelector:
    matchLabels: { tier: backend }
  policyTypes: [Egress]
  egress:
    - to:
        - podSelector: { matchLabels: { tier: database } }
      ports: [{ protocol: TCP, port: 5432 }]
