[databases]
appdb = host=postgres port=5432 dbname=appdb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; R13-01: deliberately small pool (real PgBouncer enforcement, same
; mechanism R4-03 already validated) - under normal DB latency 5
; connections is plenty for the app's real load; only becomes a
; bottleneck once R13-01's hidden Toxiproxy latency toxic makes each
; connection hold its slot for longer.
max_client_conn = 50
default_pool_size = 5
admin_users = appuser
logfile = /tmp/pgbouncer.log
