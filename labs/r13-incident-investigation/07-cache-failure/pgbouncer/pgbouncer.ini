[databases]
appdb = host=postgres port=5432 dbname=appdb

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; R6 targets cache behavior, not pool exhaustion (that's R4-03) - raised so
; the R6-05 stampede's concurrent cache-miss DB queries aren't bottlenecked
; by an unrelated pool limit.
max_client_conn = 50
default_pool_size = 20
admin_users = appuser
logfile = /tmp/pgbouncer.log
