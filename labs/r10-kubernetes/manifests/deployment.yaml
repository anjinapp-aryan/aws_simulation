apiVersion: apps/v1
kind: Deployment
metadata:
  name: r10-app
  labels: { app: r10-app }
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels: { app: r10-app }
  template:
    metadata:
      labels: { app: r10-app }
    spec:
      containers:
        - name: app
          image: r10-app:v1
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: APP_VERSION
              value: "v1"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "250m"
              memory: "128Mi"
          readinessProbe:
            httpGet: { path: /ready, port: 8000 }
            periodSeconds: 2
            failureThreshold: 2
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 2
            failureThreshold: 2
