# R14 monitoring — additive, reuses R4/R6's exact prometheus.yml shape.
#
# PRIMARY source: Patroni's own native /metrics REST API endpoint (real,
# built into patroni/patroni's api.py — not a separate exporter project).
# Scraped directly from all 3 real nodes so cluster role (primary/replica),
# WAL position, and failover state are observed from Patroni's own
# authoritative view, not inferred.
#
# SECONDARY source: postgres_exporter (prometheus-community, already used
# in R4) against the HAProxy write port — gives standard Postgres metrics
# (connection count, pg_up) for whichever node is currently the real leader.
global:
  scrape_interval: 5s

scrape_configs:
  - job_name: patroni
    metrics_path: /metrics
    static_configs:
      - targets: ["patroni1:8008", "patroni2:8008", "patroni3:8008"]

  - job_name: postgres
    static_configs:
      - targets: ["postgres_exporter:9187"]
