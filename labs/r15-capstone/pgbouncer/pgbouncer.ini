[databases]
postgres = host=haproxy port=5000 dbname=postgres

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 6432
auth_type = plain
auth_file = /etc/pgbouncer/userlist.txt
pool_mode = transaction
; Deliberately small (R15-01), same real-enforcement mechanism as R4/R13.
max_client_conn = 50
default_pool_size = 5
admin_users = postgres
logfile = /tmp/pgbouncer.log
